  papers:
    - title: "Growing Like India: The Unequal Effects of Service-Led Growth"
      pdf: /files/FPZ_UnequalGrowth.pdf
      authors:
        - name: Michael Peters
          url: https://mipeters.weebly.com
        - name: Fabrizio Zilibotti
          url: https://campuspress.yale.edu/zilibotti/
      publication: "<em>Econometrica</em>, 2023, 91(4): 1457–1494"
      resources:
        - label: Corrigendum
          url: /files/FPZ_Corrigendum.pdf
        - label: Working paper version
          url: /files/FPZ_ECMA_final.pdf
      abstract: >-
        Structural transformation in most currently developing countries takes the form of
        a rapid rise in services but limited industrialization. In this paper, we propose a new
        methodology to structurally estimate productivity growth in service industries that
        circumvents the notorious difficulties in measuring quality improvements. In our theory,
        the expansion of the service sector is both a consequence, due to income effects, and
        a cause, due to productivity growth, of the development process. We estimate the
        model using Indian household data. We find that productivity growth in nontradable
        consumer services such as retail, restaurants, or residential real estate was an important
        driver of structural transformation and rising living standards between 1987 and 2011.
        However, the welfare gains were heavily skewed toward high-income urban dwellers.

- id: working-papers
